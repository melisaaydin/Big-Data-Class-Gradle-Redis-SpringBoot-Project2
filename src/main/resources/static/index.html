<!DOCTYPE html>
<html>
<head>
    <title>Employee Data</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { border-collapse: collapse; width: 80%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body onload="loadEmployees()">
<h1>Employee </h1>

<table id="employeeTable">
    <tr>
        <th>Image</th> <th>Emp No</th>
        <th>Name</th>
        <th>Job</th>
        <th>Manager Name</th> <th>Hiredate</th>
        <th>Salary</th>
        <th>Commission</th>
        <th>Department</th>
    </tr>
</table>



<script>
    function loadEmployees() {

        fetch(`/employees/all`)
            .then(response => response.json())
            .then(data => {
                const table = document.getElementById("employeeTable");
                table.innerHTML = `
                    <tr>
                        <th>Image</th> <th>Emp No</th>
                        <th>Name</th>
                        <th>Job</th>
                        <th>Manager Name</th> <th>Hiredate</th>
                        <th>Salary</th>
                        <th>Commission</th>
                        <th>Department</th>
                    </tr>
                `;

                data.forEach(emp => {
                    let managerName;
                    if (emp.mgr === null) {
                        managerName = 'KING';
                    } else if (emp.manager && emp.manager.ename) {
                        managerName = emp.manager.ename;
                    } else {
                        managerName = 'N/A';
                    }
                    const row = table.insertRow();
                    const imgCell = row.insertCell(0);
                    const img = document.createElement('img');
                    img.src = emp.imgUrl;
                    img.style.width = '50px';
                    imgCell.appendChild(img);
                    row.insertCell(1).innerText = emp.empno;
                    row.insertCell(2).innerText = emp.ename;
                    row.insertCell(3).innerText = emp.job;

                    row.insertCell(4).innerText = managerName;
                    row.insertCell(5).innerText = new Date(emp.hiredate).toLocaleDateString();
                    row.insertCell(6).innerText = emp.sal;
                    row.insertCell(7).innerText = emp.comm !== null ? emp.comm : '-';
                    // Department Name
                    row.insertCell(8).innerText = emp.department ? emp.department.dname : 'N/A';
                });
            })
            .catch(error => console.error('API isteğinde hata:', error));
    }

    function uploadImages() {
        fetch('/upload')
            .then(response => response.text())
            .then(text => alert(text))
            .catch(error => console.error('Yükleme hatası:', error));
    }
    </script>

</body>
</html>
